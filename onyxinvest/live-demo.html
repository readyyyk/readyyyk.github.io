function received(r) {return Math.round(r.receipts.reduce((sum,x)=>sum+x.qty,0)*1000)/1000;}
function remaining(r) {return Math.max(0,Math.round((r.qty-received(r))*1000)/1000);}
function status(r) {
  if(r.stage!=='ordered') return r.stage;
  if(remaining(r)===0) return 'complete';
  return received(r)>0?'partial':'ordered';
}
function num(n) {return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:3}).format(n);}
function fmt(value,withTime=false) {
  const v=value.length===10?value+'T12:00:00':value;
  const d=new Date(v);
  if(!Number.isFinite(d.getTime())) return '—';
  return new Intl.DateTimeFormat('ru-RU',withTime?{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}:{day:'numeric',month:'short'}).format(d);
}
function e(value) {return String(value??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rid(r) {return 'ЗМ-'+String(r.id).padStart(3,'0');}
function wid(r) {return 'ОР-'+String(r.id).padStart(3,'0');}

function badge(type) {return '<span class="badge '+e(type)+'">'+e(labels[type]||type)+'</span>';}
function addLog(r,label,note='') {r.history.push({...event(label,actor().kind,dateNow(),note),person:personId});}
function nextId(list) {return 1+Math.max(0,...list.map(x=>x.id));}

function siteActionList(s) {
 const out=[];
 const add=(priority,kind,title,record,owner,when,action,href)=>out.push({priority,kind,title,record,owner,when,action,href,site:s});
 for(const r of s.requests){
  const st=status(r);
  if(['partial','ordered'].includes(st)){
   const late=r.need<today();
   add(late?0:4,late?'urgent':'wait',r.name,rid(r),'foreman',r.need,(late?'Просрочена поставка':'Ожидается поставка')+' · '+num(remaining(r))+' '+r.unit,'material/'+r.id);
  } else if(st==='pending')add(1,'act',r.name,rid(r),'manager',r.need,'Согласовать заявку','material/'+r.id);
  else if(st==='returned')add(1,'act',r.name,rid(r),'foreman',r.need,'Исправить заявку','material/'+r.id);
  else if(st==='approved')add(3,'act',r.name,rid(r),'buyer',r.need,'Оформить заказ','material/'+r.id);
 }
 for(const r of s.reports){
  if(r.stage==='review')add(2,'act',r.name,wid(r),'engineer',r.day,'Проверить объём · '+num(r.qty)+' '+r.unit,'report/'+r.id);
  else if(r.stage==='returned')add(1,'act',r.name,wid(r),'foreman',r.day,'Исправить отчёт','report/'+r.id);
 }
 return out.sort((a,b)=>a.priority-b.priority||a.when.localeCompare(b.when));
}

function missing() {return heading('Запись не найдена','Откройте нужный раздел в меню.')+link('overview','К обзору объекта','btn');}


function actionItem(url,title,number,message,tone,quantity='',extra='',siteId=activeId) {
  return `<a class="process-item ${tone}" href="${e(address(url,siteId))}"><span class="item-state"><i aria-hidden="true"></i>${e(message)}</span><strong>${e(title)}</strong><small>${e(number)}${quantity?' · '+e(quantity):''}</small>${extra}<span class="item-open" aria-hidden="true">↗</span></a>`;
}
function stage(name,owner,items,emptyText,entry='') {
  return {name,owner,items,emptyText,entry};
}
function processStage(s,index,routeKey,tone) {
  const items=s.items;
  const visible=tone==='done'?1:3;
  const prominent=items.slice(0,visible).join('');
  const extra=items.length>visible?`<details class="more-items"><summary>Ещё ${items.length-visible}</summary>${items.slice(visible).join('')}</details>`:'';
  return `<li class="process-stage"><a class="stage-top ${items.length?tone:''}" aria-label="${e(s.name)}, записей: ${items.length}" href="${e(address(routeKey))}"><span class="stage-no">${String(index+1).padStart(2,'0')}</span><strong>${e(s.name)}</strong>${items.length?'<span class="stage-count">'+items.length+'</span>':''}</a><div class="stage-owner">${e(s.owner)}</div><div class="stage-records">${prominent}${extra}${s.entry||(!items.length?`<span class="no-work">${e(s.emptyText)}</span>`:'')}</div></li>`;
}
function processMap(list=[state],aggregate=false) {
  const scoped=(s,r)=>({...r,siteId:s.id,siteName:s.name});
  const req=list.flatMap(s=>s.requests.map(r=>scoped(s,r))).sort((a,b)=>a.need.localeCompare(b.need)||b.id-a.id);
  const reports=list.flatMap(s=>s.reports.map(r=>scoped(s,r))).sort((a,b)=>b.day.localeCompare(a.day)||b.id-a.id);
  const material=(r,msg,tone,quantity='',extra='')=>actionItem('material/'+r.id,r.name,aggregate?r.siteName+' · '+rid(r):rid(r),msg,tone,quantity,extra,r.siteId);
  const work=(r,msg,tone)=>actionItem('report/'+r.id,r.name,aggregate?r.siteName+' · '+wid(r):wid(r),msg,tone,num(r.qty)+' '+r.unit,'',r.siteId);
  const mats=[
    stage('Заявка','Прораб',req.filter(r=>r.stage==='returned').map(r=>material(r,'Исправить заявку','act')),'Нет возвратов',aggregate?'':btn('+ Новая заявка','new-material','stage-add')),
    stage('Согласование','Руководитель',req.filter(r=>r.stage==='pending').map(r=>material(r,'Принять решение','act')),'Нет заявок на согласовании'),
    stage('Заказ','Снабжение',req.filter(r=>r.stage==='approved').map(r=>material(r,'Оформить заказ','act')),'Нет заявок к заказу'),
    stage('Приёмка','Прораб / снабжение',req.filter(r=>stageGroup(r)==='delivery').map(r=>{
      const late=r.need<today();
      const progress=received(r)>0?`<span class="stage-progress" aria-hidden="true"><i style="width:${100*received(r)/r.qty}%"></i></span><span class="stage-quantity">Получено ${num(received(r))} из ${num(r.qty)} ${e(r.unit)}</span>`:'';
      return material(r,late?'Уточнить срок поставки':received(r)>0?'Частичная поставка':'Ожидается поставка',late?'act':'wait','остаток '+num(remaining(r))+' '+r.unit,progress);
    }),'Поставок в ожидании нет'),
    stage('Завершено','Итог заявки',req.filter(r=>['complete','rejected'].includes(status(r))).map(r=>material(r,labels[status(r)],'done',status(r)==='complete'?num(received(r))+' '+r.unit:'')),'Нет закрытых заявок')
  ];
  const checks=[
    stage('Отчёт','Прораб',reports.filter(r=>r.stage==='returned').map(r=>work(r,'Исправить отчёт','act')),'Нет возвратов',aggregate?'':btn('+ Новый отчёт','new-report','stage-add')),
    stage('Проверка','Инженер',reports.filter(r=>r.stage==='review').map(r=>work(r,'Проверить объём','act')),'Все отчёты проверены'),
    stage('Табель','Подтверждённые работы',reports.filter(r=>r.stage==='confirmed').map(r=>work(r,'Учтено в табеле','done')),'Нет подтверждённых работ')
  ];
  function lane(label,href,stages,linkLabel,cls,targets,tones) {
    return `<section class="lane ${cls}"><div class="lane-head"><h3>${label}</h3>${link(aggregate?'queue/'+href:href,linkLabel+' ↗','textlink')}</div><ol class="process-stages">${stages.map((s,i)=>processStage(s,i,aggregate?'queue/'+targets[i]:targets[i],tones[i])).join('')}</ol></section>`;
  }
  return `<section class="process-board" aria-labelledby="process-title"><header class="process-head"><h2 id="process-title">${aggregate?'Процессы по объектам':'Процессы объекта'}</h2><div class="board-key"><span class="act">Требует действия</span><span class="wait">Ожидается</span><span class="done">Завершено</span></div></header>${lane('Материалы','materials',mats,'Все заявки','materials-lane',['materials?returned','materials?pending','materials?approved','materials?delivery','materials?closed'],['act','act','act',req.some(r=>stageGroup(r)==='delivery'&&r.need<today())?'act':'wait','done'])}${lane('Отчёты о работах','timesheet',checks,'Открыть табель','reports-lane',['reports?returned','reports?review','timesheet'],['act','act','done'])}</section>`;
}
function overview() {
  const metrics=[
    ['На согласовании',state.requests.filter(r=>r.stage==='pending').length,'materials?pending'],
    ['К заказу',state.requests.filter(r=>r.stage==='approved').length,'materials?approved'],
    ['Ожидают поставки',state.requests.filter(r=>stageGroup(r)==='delivery').length,'materials?delivery'],
    ['Отчёты на проверке',state.reports.filter(r=>r.stage==='review').length,'reports?review']
  ];
  return `<header class="compact-project"><div><span class="project-context">Обзор объекта</span><h1>${e(state.name)}</h1><p>${e(state.unit)} · ${e(state.phase)} ${link('project','Паспорт объекта ↗','textlink')}</p></div>${state.docs.some(d=>d.type==='photo'&&d.id==='site')?`<a class="project-thumb" href="${e(address('document/site'))}" aria-label="Открыть фото площадки"><img src="${PHOTO}" alt="Строительство корпуса 2"><span>Фото ↗</span></a>`:''}</header>
  <div class="metrics process-metrics" aria-label="Основные показатели">${metrics.map(([label,value,url])=>`<a href="${e(address(url))}" class="metric"><span>${label}</span><div><b>${value}</b><span class="round-arrow" aria-hidden="true">↗</span></div></a>`).join('')}</div>${processMap()}`;
}


function materialView(r) {
  if(!r) return missing();
  const st=status(r);
  const next={
    pending:()=> actor().kind==='manager'?`<div class="actions">${btn('Согласовать','approve-request')}${btn('Вернуть на уточнение','return-material','btn')}${btn('Отклонить','reject-material','btn subtle')}</div>`:available('manager','Согласовать','decision-material'),
    approved:()=>available('buyer','Оформить заказ','order'),
    ordered:()=>available(['foreman','buyer'],'Принять поставку','receipt'),
    partial:()=>available(['foreman','buyer'],'Принять поставку','receipt'),
    returned:()=>available('foreman','Исправить заявку','edit-material'),
    rejected:()=>'<p class="end-note">Решение и причина отказа сохранены в журнале.</p>',
    complete:()=>'<p class="end-note">Материал получен в полном объёме.</p>'
  };
  const phases=['Заявка','Решение','Заказ','Приёмка'];
  const reached=st==='complete'?4:['partial','ordered'].includes(st)?3:st==='approved'?2:1;
  return back('materials','Материалы')+heading(r.name,rid(r)+' · '+state.unit+' · '+r.where)+`<div class="state-line">${badge(st)}<span>Нужно к ${fmt(r.need)}</span></div>
  <div class="details-grid"><div class="stack">${balance(r)}<section class="panel padded"><h2>Исполнение заявки</h2><ol class="steps">${phases.map((s,i)=>`<li class="${i<reached?'done':(i===3 && st==='partial'?'current':'')}"><span></span>${s}</li>`).join('')}</ol>${next[st]()}</section>
  <section class="panel padded"><h2>Параметры заявки</h2>${facts([['Материал',r.name],['Потребность',num(r.qty)+' '+r.unit],['Участок',r.where],['Нужно к',fmt(r.need)],...(r.supplier?[['Поставщик',r.supplier]]:[])])}${r.note?`<p class="note">${e(r.note)}</p>`:''}</section></div>
  <div class="stack"><section class="panel">${sectionHead('Документы заявки')}${docsList(state.docs.filter(d=>d.source==='material/'+r.id))}</section><section class="panel padded"><h2>Журнал заявки</h2>${activity(r)}</section></div></div>`;
}
function reportView(r) {
  if(!r) return missing();
  const action=r.stage==='review'?(actor().kind==='engineer'?`<div class="actions">${btn('Подтвердить объём','confirm-report')}${btn('Вернуть на уточнение','return-report','btn')}</div>`:available('engineer','Проверить отчёт','decision-report')):r.stage==='returned'?available('foreman','Исправить отчёт','edit-report'):link('timesheet','Открыть табель →','btn');
  return back('reports','Отчёты о работах')+heading(r.name,wid(r)+' · '+state.unit+' · '+r.where)+`<div class="state-line">${badge(r.stage)}<span>Работы за ${fmt(r.day)}</span></div><div class="details-grid"><div class="stack"><section class="panel padded"><h2>Выполненная работа</h2><div class="work-total">${num(r.qty)} <span>${e(r.unit)}</span></div>${facts([['Бригада',r.crew],['Дата работ',fmt(r.day)],['Участок',r.where]])}${r.note?`<p class="note">${e(r.note)}</p>`:''}<div class="action-block">${action}</div></section>
  <section class="panel">${sectionHead('Приложения')}${r.photo?docsList(state.docs.filter(d=>d.id==='site')):empty('К отчёту пока ничего не приложено.')}</section></div><section class="panel padded"><h2>Журнал отчёта</h2>${activity(r)}</section></div>`;
}
function documentView(d) {
  if(!d) return missing();
  const isPhoto=d.type==='photo';
  const request=!isPhoto?state.requests.find(r=>d.source==='material/'+r.id):null;
  const related=isPhoto?state.reports.find(r=>d.source==='report/'+r.id):request;
  const from=related?(isPhoto?wid(related):rid(related))+' · '+related.name:'Открыть запись';
  const content=isPhoto?`<figure class="photo-page"><img src="${PHOTO}" alt="Фото строящегося жилого корпуса"><figcaption>${e(state.name)} · ${e(state.unit)} · Учебная фотография площадки</figcaption></figure>`:
  `<article class="paper"><div class="paper-top"><b>ОНИКСИНВЕСТ</b><span>ОБРАЗЕЦ</span></div><h2>${e(d.name)}</h2><p>№ ${e(d.number)} от ${fmt(d.day)} ${e(d.day.slice(0,4))} г.</p>${facts([['Объект',state.name+' · '+state.unit],['Поставщик',request?.supplier||'Учебный поставщик']])}<div class="paper-line"><span>Наименование</span><span>Количество</span></div><div class="paper-line value"><strong>${e(request?.name||'Материал')}</strong><b>${num(d.qty)} ${e(request?.unit)}</b></div><small>Демонстрационный документ · данные учебные</small></article>`;
  return back('documents','Документы')+heading(d.name,d.number+' · '+fmt(d.day))+`<div class="details-grid"><section class="panel doc-preview">${content}</section><section class="panel padded"><h2>Карточка файла</h2>${facts([['Вид',isPhoto?'Фотография':d.name],['Добавил',USERS[d.person || state.team[d.author]].name],['Версия','1'],['Объект',state.unit]])}<h3>Основание</h3>${link(d.source,e(from)+' ↗','textlink')}</section></div>`;
}
function desk(){
 const available=visibleSites();
 const requests=available.flatMap(s=>s.requests),reports=available.flatMap(s=>s.reports);
 const metrics=[['На согласовании',requests.filter(r=>r.stage==='pending').length,'materials?pending'],['К заказу',requests.filter(r=>r.stage==='approved').length,'materials?approved'],['Ожидают поставки',requests.filter(r=>stageGroup(r)==='delivery').length,'materials?delivery'],['Отчёты на проверке',reports.filter(r=>r.stage==='review').length,'reports?review']];
 return heading('Рабочая сводка','Материалы и работы по всем доступным площадкам.',link('portfolio','Все объекты · '+available.length,'btn'))+`<div class="metrics process-metrics">${metrics.map(([name,n,url])=>link('queue/'+url,`<span>${name}</span><div><b>${n}</b><span class="round-arrow">↗</span></div>`,'metric')).join('')}</div>`+processMap(available,true);
}
function allStage(){
 const [key,param='all']=route().slice('queue/'.length).split('?');
 const work=key==='reports'||key==='timesheet';const chosen=key==='timesheet'?'confirmed':param;
 const rows=visibleSites().flatMap(s=>(work?s.reports:s.requests).filter(r=>chosen==='all'||(work?r.stage===chosen:chosen==='closed'?['complete','rejected'].includes(status(r)):stageGroup(r)===chosen)).map(r=>`<tr><td>${siteLink(s,(work?'report/':'material/')+r.id,`${tag(work?wid(r):rid(r))}<strong>${e(r.name)}</strong>`,'record')}</td><td>${siteLink(s,'overview',e(s.name),'textlink')}</td><td>${e(work?r.crew:r.where)}</td><td>${num(r.qty)} ${e(r.unit)}</td><td>${badge(work?r.stage:status(r))}</td></tr>`));
 const names=work?filters.reports:filters.materials;
 return link('desk','← Рабочая сводка','back')+heading((work?'Отчёты':'Материалы')+' · '+(names[chosen]||'Все'),'По всем доступным объектам')+`<section class="panel">${table(['Запись','Объект',work?'Бригада':'Участок','Объём','Состояние'],rows)}</section>`;
}


function render() {
 const current=context();
 const site=current.id && Object.hasOwn(sites,current.id)?sites[current.id]:null;
 if(current.id&&!assigned(site)){
  history.replaceState(null,'','#portfolio');render();reveal('Объект недоступен этому участнику. Открыты назначенные объекты.');return;
 }
 activeId=current.id;state=site;
 const full=current.view;const [path,param]=full.split('?');const [type,id]=path.split('/');
 if(site&&!location.hash.startsWith('#s/'))history.replaceState(null,'',address(full));
 const section=({material:'materials',report:'reports',document:'documents'}[type]||type);
 if(filters[section])filter=param&&Object.hasOwn(filters[section],param)?param:'all';
 const all=visibleSites();
 const pick=document.querySelector('#site-picker');
 pick.innerHTML='<option value="">Все объекты</option>'+all.map(s=>`<option value="${e(s.id)}">${e(s.name+' · '+s.unit)}</option>`).join('');
 pick.value=activeId||'';
 document.querySelector('#nav').innerHTML=`<a href="#desk" ${!site&&type!=='portfolio'?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">◧</span>Рабочая сводка</a><a href="#portfolio" ${!site&&type==='portfolio'?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">▦</span>Все объекты</a>`+
 (site?'<div class="nav-divider"></div>'+[['overview','Обзор объекта','◧'],['project','Паспорт объекта','▣'],...navItems.slice(1)].map(([key,name,icon])=>`<a href="${e(address(key))}" ${key===section?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span><span>${name}</span></a>`).join(''):'');
 document.querySelector('#side-context').textContent=site?site.name:'Портфель объектов';
 document.querySelector('#side-unit').textContent=site?site.unit:'ОНИКСИНВЕСТ';
 document.querySelector('#side-sign').textContent=site?site.name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase():'ОИ';
 document.querySelector('#side-target').href=site?address('project'):'#portfolio';
 document.querySelector('[data-action="reset"]').hidden=!site||actor().kind!=='manager';
 const role=document.querySelector('#role');
 role.innerHTML=Object.entries(USERS).map(([key,u])=>`<option value="${key}">${e(u.name+' · '+u.role)}</option>`).join('');role.value=personId;
 document.querySelector('#role-person').textContent=actor().role;
 document.querySelector('#role-initials').textContent=actor().initials;
 document.querySelector('#store-state').textContent=storageMessage;document.querySelector('#store-state').hidden=!storageMessage;
 const views={overview,project,materials,reports,timesheet,documents,material:()=>materialView(state.requests.find(r=>String(r.id)===id)),report:()=>reportView(state.reports.find(r=>String(r.id)===id)),document:()=>documentView(state.docs.find(d=>d.id===id))};
 page.innerHTML=!site?(type==='desk'?desk():type==='queue'?allStage():portfolio()):(Object.hasOwn(views,type)?views[type]:missing)();
 document.title=[page.querySelector('h1')?.textContent,site&&type!=='overview'?site.name:'','Ониксинвест'].filter(Boolean).join(' · ');decorateFeedback();
}
document.querySelector('#site-picker').addEventListener('change',ev=>{
 const target=ev.target.value;
 if(!target){location.hash='portfolio';return;}
 if(!Object.hasOwn(sites,target)||!assigned(sites[target]))return;
 const view=route().split(/[/?]/)[0];
 const destination=({material:'materials',report:'reports',document:'documents'}[view]||view);
 location.hash=address(['project','materials','reports','documents','timesheet'].includes(destination)?destination:'overview',target);
});
window.addEventListener('storage',ev=>{
 if(ev.key===ACTOR_KEY && Object.hasOwn(USERS,ev.newValue)){
  personId=ev.newValue;if(modal.open)modal.close();queueScope='priority';render();return;
 }
 if(!ev.key?.startsWith(KEY_PREFIX)||!ev.newValue)return;
 try {
  const changed=JSON.parse(ev.newValue);
  if(!validSite(changed)||ev.key!==KEY_PREFIX+changed.id)return;
  sites[changed.id]=changed;
  if(changed.id===activeId&&modal.open){modal.close();reveal('Данные объекта обновлены в другой вкладке. Откройте форму заново.');}
  render();
 }catch{}
});


function currentRecord(kind) {
  if(!state)return null;
  const [type,id]=route().split('/');
  return type===kind?(kind==='material'?state.requests:state.reports).find(r=>String(r.id)===id):null;
}
function reveal(message) {
  const el=document.querySelector('#toast');el.textContent=message;el.hidden=false;
  window.clearTimeout(reveal.timer);reveal.timer=setTimeout(()=>{el.hidden=true;},3200);
}
function showModal(title,body,submit='',mode='',description='') {
  if(modal.open) modal.close();
  modal.dataset.mode=mode;
  modal.dataset.route=location.hash;
  modal.innerHTML=`<form id="form"><div class="dialog-title"><div><small>${e(state?state.name+' · '+state.unit:'Портфель объектов')}</small><h2 id="dialog-title">${e(title)}</h2></div><button type="button" class="close" data-action="close" aria-label="Закрыть">×</button></div>${description?`<p class="form-description">${e(description)}</p>`:''}<div class="fields">${body}</div><p id="problem" role="alert"></p>${submit?`<div class="dialog-foot">${btn('Отмена','close','btn')}<button class="btn primary" type="submit">${e(submit)}</button></div>`:''}</form>`;
  feedbackFormLink(mode);
  modal.showModal();
  (modal.querySelector('.fields input,.fields textarea,.fields select,.fields button')||modal.querySelector('.dialog-foot .primary')||modal.querySelector('.close'))?.focus();
}
function input(name,label,type='text',value='',options={}) {
  return `<label>${e(label)}<input name="${name}" type="${type}" value="${e(value)}" ${options.optional?'':'required'} ${type==='number'?'min="0.001" step="0.001"':''} ${options.max!==undefined?`max="${e(options.max)}"`:''} ${type==='text'?'maxlength="140"':''} ${options.placeholder?`placeholder="${e(options.placeholder)}"`:''}></label>`;
}
function select(name,label,values,current) {return `<label>${e(label)}<select name="${name}">${values.map(v=>`<option${v===current?' selected':''}>${e(v)}</option>`).join('')}</select></label>`;}
function area(name,label,value='',required=false) {return `<label>${e(label)}<textarea name="${name}" rows="3" maxlength="600"${required?' required':''}>${e(value)}</textarea></label>`;}
function newMaterial(r) {
  showModal(r?'Исправить заявку':'Новая заявка на материалы',input('name','Материал','text',r?.name||'',{placeholder:'Например, арматура Ø12'})+`<div class="form-grid">${input('qty','Количество','number',r?.qty||'')}${select('unit','Единица',units,r?.unit||'шт.')}</div>`+select('where','Участок',state.zones,r?.where)+input('need','Нужно к','date',r?.need||today())+area('note','Примечание',r?.note),r?'Отправить повторно':'Отправить заявку',r?'resubmit-material':'create-material');
}
function newReport(r) {
  showModal(r?'Исправить отчёт':'Новый отчёт о работах',input('name','Вид работ','text',r?.name||'',{placeholder:'Например, монтаж опалубки'})+`<div class="form-grid">${input('qty','Выполненный объём','number',r?.qty||'')}${select('unit','Единица',units,r?.unit||'м²')}</div>`+select('crew','Бригада',state.crews,r?.crew)+select('where','Участок',state.zones,r?.where)+input('day','Дата работ','date',r?.day||today())+area('note','Описание',r?.note)+(state.docs.some(d=>d.id==='site' && d.type==='photo')?`<label class="check"><input type="checkbox" name="photo" ${r?.photo?'checked':''}> Приложить учебное фото площадки</label>`:''),r?'Отправить повторно':'Отправить на проверку',r?'resubmit-report':'create-report');
}
function requestRole(role,action) {
  showModal('Сменить роль для действия',`<div class="role-preview"><span class="avatar">${currentTeamUser(role).initials}</span><div><strong>${currentTeamUser(role).name}</strong><small>${currentTeamUser(role).role}</small></div></div>`+btn('Продолжить в роли «'+currentTeamUser(role).role+'»','switch:'+role+':'+action),'','','В этом демо у каждого действия есть исполнитель.');
}


function exportMaterials() {
  const sheetRows=[['Объект','Заявка','Материал','Секция','Количество','Ед.','Получено','Осталось','Нужно к','Состояние'],...state.requests.map(r=>[state.name+' · '+state.unit,rid(r),r.name,r.where,r.qty,r.unit,received(r),remaining(r),r.need,labels[status(r)]])];
  const xml=(v)=>e(v).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');

function commit(message,to) {

function handle(action) {
  const r=currentRecord('material'), work=currentRecord('report');
  if(action==='close') {modal.close();return;}
  if(['new-site','edit-site'].includes(action)&&actor().kind==='manager'){objectForm(action==='edit-site'?state:null);return;}
  if(!state||!assigned(state))return;
  if(action.startsWith('switch:')) {
    const [,role,next]=action.split(':');
    if(!state || !Object.hasOwn(state.team,role))return;
    if(modal.open) modal.close();
    choosePerson(state.team[role]);render();handle(next);return;
  }
  if(action==='reset' && actor().kind==='manager') {
    showModal('Сбросить операции объекта?', '<p>Заявки, отчёты и документы площадки «'+e(state.name)+'» вернутся к исходным учебным записям. Паспорт и команда сохранятся.</p>', 'Сбросить операции','reset');
    return;
  }
  if(action==='excel') {exportMaterials();return;}
  if(action==='new-material'||action==='new-report') {
    if(actor().kind!=='foreman') return requestRole('foreman',action);
    return action==='new-material'?newMaterial():newReport();
  }
  if(action==='edit-material' && r?.stage==='returned' && actor().kind==='foreman') return newMaterial(r);
  if(action==='edit-report' && work?.stage==='returned' && actor().kind==='foreman') return newReport(work);
  if(r && r.stage==='pending' && actor().kind==='manager') {
    if(action==='decision-material') return showModal('Решение по заявке',`<p>${e(r.name)} · ${num(r.qty)} ${e(r.unit)}</p><div class="actions">${btn('Согласовать','approve-request')}${btn('Вернуть на уточнение','return-material','btn')}${btn('Отклонить','reject-material','btn')}</div>`);
    if(action==='approve-request') {
      r.stage='approved';addLog(r,'Заявка согласована');commit('Заявка согласована');return;
    }
    if(action==='return-material'||action==='reject-material') return showModal(action==='return-material'?'Вернуть заявку на уточнение':'Отклонить заявку',area('reason','Причина для прораба','',true),'Сохранить решение',action);
  }
  if(action==='order' && r?.stage==='approved' && actor().kind==='buyer') {
    return showModal('Оформить заказ',input('supplier','Поставщик','text','',{placeholder:'Название учебного поставщика'})+input('number','Номер счёта','text','',{placeholder:'Например, СЧ-205'})+`<p class="form-help">Образец счёта появится в документах заявки.</p>`,'Зарегистрировать заказ','order',r.name+' · '+num(r.qty)+' '+r.unit);
  }
  if(action==='receipt' && r?.stage==='ordered' && remaining(r)>0 && ['buyer','foreman'].includes(actor().kind)) {
    return showModal('Принять поставку',input('qty','Получено, '+r.unit,'number',remaining(r),{max:remaining(r)})+input('number','Номер накладной','text','',{placeholder:'Например, ТН-072'}),'Сохранить приёмку','receipt','Осталось получить '+num(remaining(r))+' '+r.unit+' · '+r.name);
  }
  if(work?.stage==='review' && actor().kind==='engineer') {
    if(action==='decision-report') return showModal('Проверить отчёт',`<p>${e(work.name)} · ${num(work.qty)} ${e(work.unit)} · ${e(work.crew)}</p><div class="actions">${btn('Подтвердить объём','confirm-report')}${btn('Вернуть на уточнение','return-report','btn')}</div>`);
    if(action==='confirm-report') {
      work.stage='confirmed';addLog(work,'Объём подтверждён');commit('Подтверждённый объём появился в табеле');return;
    }
    if(action==='return-report') return showModal('Вернуть отчёт на уточнение',area('reason','Комментарий для прораба','',true),'Вернуть отчёт','return-report');
  }
}

function submitForm(form) {
  const mode=modal.dataset.mode;
  if(!mode||modal.dataset.route!==location.hash) return;
  const data=Object.fromEntries(new FormData(form));
  for(const key of Object.keys(data)) if(typeof data[key]==='string') data[key]=data[key].trim();
  const fail=s=>{document.querySelector('#problem').textContent=s;};
  for(const el of form.querySelectorAll('[required]')) if(!data[el.name]) {el.focus();return fail('Заполните поле «'+el.parentElement.textContent.trim()+'».');}
  const r=currentRecord('material'),work=currentRecord('report');
  if(mode==='new-site'||mode==='edit-site')return storeFormSite(mode,data,fail);
  if(!state||!assigned(state))return;
  if(mode==='reset'&&actor().kind==='manager') {const sample=mockSites()[state.id];for(const k of ['requests','reports','docs'])state[k]=sample?sample[k]:[];stampAuthors(state);query='';commit('Операции объекта сброшены','overview');return;}
  if(data.qty!==undefined && (!Number.isFinite(Number(data.qty))||Number(data.qty)<=0)) return fail('Количество должно быть больше нуля.');
  if((mode==='create-material'||mode==='resubmit-material') && actor().kind==='foreman') {
    if(mode==='resubmit-material' && r?.stage!=='returned') return;
    const target=mode==='create-material'?{id:nextId(state.requests),history:[],receipts:[]}:r;
    Object.assign(target,{name:data.name,qty:Number(data.qty),unit:data.unit,where:data.where,need:data.need,note:data.note,stage:'pending'});
    addLog(target,mode==='create-material'?'Заявка отправлена':'Исправленная заявка отправлена повторно');
    if(mode==='create-material') state.requests.unshift(target);
    return commit('Заявка передана на согласование','material/'+target.id);
  }
  if((mode==='create-report'||mode==='resubmit-report') && actor().kind==='foreman') {
    if(mode==='resubmit-report' && work?.stage!=='returned') return;
    const target=mode==='create-report'?{id:nextId(state.reports),history:[]}:work;
    Object.assign(target,{name:data.name,qty:Number(data.qty),unit:data.unit,where:data.where,day:data.day,crew:data.crew,note:data.note,photo:data.photo==='on',stage:'review'});
    addLog(target,'Отчёт отправлен на проверку');
    if(mode==='create-report') state.reports.unshift(target);
    return commit('Отчёт передан инженеру','report/'+target.id);
  }
  if(['reject-material','return-material'].includes(mode) && r?.stage==='pending' && actor().kind==='manager') {
    r.stage=mode==='reject-material'?'rejected':'returned';addLog(r,r.stage==='rejected'?'Заявка отклонена':'Заявка возвращена на уточнение',data.reason);return commit('Решение сохранено');
  }
  if(mode==='order' && r?.stage==='approved' && actor().kind==='buyer') {
    r.supplier=data.supplier;r.stage='ordered';saveDocument('order',data.number,r.qty,r);addLog(r,'Заказ зарегистрирован',data.supplier+' · '+data.number);return commit('Заказ зарегистрирован');
  }
  if(mode==='receipt' && r?.stage==='ordered' && ['foreman','buyer'].includes(actor().kind)) {
    const qty=Number(data.qty);
    if(qty>remaining(r)) return fail('Получено больше остатка. Максимум '+num(remaining(r))+' '+r.unit+'.');
    if(r.receipts.some(x=>x.number.toLocaleLowerCase('ru')===data.number.toLocaleLowerCase('ru'))) return fail('Эта накладная уже учтена в заявке.');
    const doc=saveDocument('receipt',data.number,qty,r);
    r.receipts.push({qty,number:data.number,doc,at:dateNow()});
    addLog(r,'Принято '+num(qty)+' '+r.unit,'Накладная '+data.number);
    return commit(remaining(r)?'Частичная поставка сохранена':'Поставка полностью получена');
  }
  if(mode==='return-report' && work?.stage==='review' && actor().kind==='engineer') {
    work.stage='returned';addLog(work,'Отчёт возвращён на уточнение',data.reason);return commit('Отчёт возвращён прорабу');
  }
}
